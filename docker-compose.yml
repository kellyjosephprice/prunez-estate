services:
  homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:stable"
    volumes:
      - /opt/prunez-estate/config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    privileged: true
    network_mode: host
    environment:
      TZ: America/Los_Angeles

  deconz:
    image: deconzcommunity/deconz
    container_name: deconz
    restart: always
    ports:
      - 8001:80
      # Moved off host 443 so Pi-hole can use it. deCONZ's websocket is now
      # reachable on host port 8443 (container side stays 443 / DECONZ_WS_PORT).
      - 8443:443
    volumes:
      - /opt/deconz:/opt/deCONZ
    devices:
      - /dev/ttyUSB0
    environment:
      - DECONZ_BAUDRATE=115200
      - DECONZ_WEB_PORT=80
      - DECONZ_WS_PORT=443
      - DEBUG_INFO=1
      - DEBUG_APS=0
      - DEBUG_ZCL=0
      - DEBUG_ZDP=0
      - DEBUG_OTA=0

  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    # Host networking so Pi-hole's DHCP server actually reaches LAN clients:
    # DHCP discover/request are broadcasts and don't cross Docker's bridge NAT.
    # With host networking Pi-hole binds these directly on the host:
    #   53/tcp+udp  DNS
    #   67/udp      DHCP
    #   80/tcp      web admin (HTTP)
    #   443/tcp     web admin (HTTPS, self-signed cert generated by FTL)
    # DEPLOY NOTE: free host port 53 first (disable/redirect systemd-resolved),
    # otherwise FTL can't bind DNS.
    network_mode: host
    # Password + DHCP range live here (gitignored). See prunez-estate.env.example.
    env_file: "prunez-estate.env"
    environment:
      # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
      TZ: "America/Los_Angeles"
    # Volumes store your data between container upgrades
    volumes:
      # For persisting Pi-hole's databases and common configuration file
      - "/opt/etc-pihole:/etc/pihole"
    cap_add:
      # See https://docs.pi-hole.net/docker/#note-on-capabilities
      # Required for the DHCP server
      - NET_ADMIN
      # Lets Pi-hole's NTP client set the host system time
      - SYS_TIME
      # Optional, gives FTL a bit more processing priority
      - SYS_NICE
    restart: unless-stopped

  actual:
    container_name: actual
    image: docker.io/actualbudget/actual-server:latest
    restart: unless-stopped
    ports:
      - 5006:5006
    volumes:
      - /opt/actual:/data
    environment:
      # Real, browser-trusted cert for kidney's Tailscale name
      # (kidney.dinosaur-aldebaran.ts.net), issued by `tailscale cert`.
      # Renew with the same command before it expires (Tailscale/Let's
      # Encrypt certs are short-lived, ~90 days) — not yet automated.
      # Only one cert is served: visiting by the plain LAN IP instead of
      # the Tailscale name now shows a hostname-mismatch warning instead
      # of a self-signed one (selfhost.* is unused but left in /opt/actual).
      - ACTUAL_HTTPS_KEY=/data/tailscale.key
      - ACTUAL_HTTPS_CERT=/data/tailscale.crt
    healthcheck:
      # The image's own health-check.js connects to https://localhost and
      # fails TLS hostname verification, since our cert only covers the
      # Tailscale name. rejectUnauthorized is only skipped for this
      # same-host liveness probe — real clients still get full verification.
      test:
        [
          "CMD-SHELL",
          "node -e \"require('https').get({host:'localhost',port:5006,rejectUnauthorized:false},r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\"",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

  netdata:
    container_name: netdata
    image: netdata/netdata
    restart: unless-stopped
    hostname: kidney
    ports:
      - 19999:19999
    # Needs broad read access to the host to report full metrics (and
    # docker.sock to see per-container stats) — more than the other
    # containers here get. Not included in the nightly backup; this is
    # live telemetry, not data worth preserving.
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  netdataconfig:
  netdatalib:
  netdatacache:
